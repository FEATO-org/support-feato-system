name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: .go-version
      - name: Verify Go modules, tests and build
        run: |
          go mod verify
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          make build
      - name: Test release logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/release -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Prepare tracked Docker context
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
      - name: Build production image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ runner.temp }}/source
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sfs-ci
          cache-to: type=gha,scope=sfs-ci,mode=max
          build-args: GO_VERSION=${{ steps.go.outputs.go-version }}
