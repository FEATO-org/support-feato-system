name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: .go-version
      - name: Verify Go modules, tests and build
        run: |
          go mod verify
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          make build
      - name: Test release logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/release -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare tracked Docker context
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
      - name: Build production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/source
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sfs-ci
          cache-to: type=gha,scope=sfs-ci,mode=max
          build-args: GO_VERSION=${{ steps.go.outputs.go-version }}
