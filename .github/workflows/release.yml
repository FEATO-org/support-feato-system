name: Release SFS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release
          - resume
      version:
        description: Existing CalVer for resume only
        required: false
        type: string

permissions: {}

concurrency:
  group: sfs-container-release
  cancel-in-progress: false

env:
  RELEASE_MODE: ${{ inputs.mode }}
  RESUME_VERSION: ${{ inputs.version }}
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Draft visibility and the non-persisting generate-notes API require write access.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Record execution and reject invalid refs
        run: |
          {
            printf '## SFS release plan\n\n'
            printf -- '- Mode: %s\n- Dispatch ref: %s\n- Dispatch SHA: %s\n' "$RELEASE_MODE" "$GITHUB_REF" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Select main when dispatching Release SFS.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release state and freeze the version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py plan
      - name: Generate GitHub Release Notes preview
        if: inputs.mode == 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TARGET_SHA: ${{ steps.plan.outputs.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: python3 scripts/release/release.py notes
      - name: Summarize the release plan
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\n- Plan: **%s**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RELEASE_MODE" == dry-run ]]; then
            printf -- '- The proposed version was not reserved.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.build == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Extract pinned source
        if: needs.plan.outputs.build == 'true'
        id: source
        env:
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive "$TARGET_SHA" | tar -x -C "$RUNNER_TEMP/source"
          if [[ -f "$RUNNER_TEMP/source/.go-version" ]]; then
            go_version=$(cat "$RUNNER_TEMP/source/.go-version")
          else
            # A tag-only recovery may target a revision from before this workflow.
            go_version=$(awk -F '"' '$1 ~ /^[[:space:]]+GO_VERSION:[[:space:]]*$/ { print $2 }' \
              "$RUNNER_TEMP/source/docker-compose.yml")
          fi
          [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "go-version=$go_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.plan.outputs.build == 'true'
        with:
          go-version: ${{ steps.source.outputs.go-version }}
          cache-dependency-path: ${{ runner.temp }}/source/go.sum
      - name: Test pinned Go source
        id: tests
        if: needs.plan.outputs.build == 'true'
        working-directory: ${{ runner.temp }}/source
        run: |
          go mod verify
          go test -mod=readonly ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.plan.outputs.build == 'true'
      - name: Export verified production image
        id: image
        if: needs.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/source
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/sfs.oci.tar
          cache-from: type=gha,scope=sfs-release
          cache-to: type=gha,scope=sfs-release,mode=max
          provenance: false
          sbom: false
          build-args: GO_VERSION=${{ steps.source.outputs.go-version }}
          labels: |
            org.opencontainers.image.source=https://github.com/FEATO-org/support-feato-system
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
      - name: Verify built manifest and OCI metadata
        if: needs.plan.outputs.build == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/sfs.oci.tar
        run: python3 scripts/release/release.py archive
      - name: Pass the exact image to the publisher
        id: artifact
        if: inputs.mode != 'dry-run' && needs.plan.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfs-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sfs.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Summarize verification
        if: always()
        env:
          RESULT: ${{ job.status }}
          MODE: ${{ inputs.mode }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.image.outcome }}
        run: |
          printf '## SFS verification (%s)\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Verification: **%s**\n- Go tests: **%s**\n- Container build: **%s**\n' "$RESULT" "$TESTS" "$BUILD" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'release' || inputs.mode == 'resume')
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install image transfer tool
        if: needs.plan.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Download the validated image
        if: needs.plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish or resume from verified state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          IMAGE_ARCHIVE: ${{ needs.plan.outputs.build == 'true' && format('{0}/sfs.oci.tar', runner.temp) || '' }}
        run: python3 scripts/release/release.py publish
      - name: Summarize publication
        if: always()
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          printf '\n- Publication result: **%s**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != success ]]; then
            printf -- '- Inspect Git, GHCR and GitHub Release state. If any formal artifact exists, dispatch resume from main with version %s. See docs/release.md.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
